# ---------------------------------------------------------------------------
# Configuración del Alcance del Análisis (Scope)
# ---------------------------------------------------------------------------

# Archivos y directorios a excluir del análisis de calidad y duplicados.
# Se excluyen reportes de cobertura y artefactos generados para evitar falsos positivos.
sonar.exclusions=\
  Backend/eslint.config.js,\
  Backend/.scannerwork/**,\
  Backend/coverage/**,\
  Backend/**/*.html

# (Opcional) Si usas TypeScript/JavaScript y quieres asegurar que la cobertura se lea 
# pero NO se analice su código visual, mantén la ruta del reporte separada:
# sonar.javascript.lcov.reportPaths=Backend/coverage/lcov.info